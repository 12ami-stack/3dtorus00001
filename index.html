<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Torus Polyhedron Rolling Game (3 Types of Stars)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .score-box {
            font-size: 18px;
            margin-bottom: 5px;
            color: #e0e0ff;
        }
        .speed-tag {
            font-size: 14px;
            color: #00ffcc;
            background: rgba(0, 255, 200, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
        }
        .instructions {
            font-size: 12px;
            color: #8a8aaf;
            margin-top: 10px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <h1>TORUS RUNNER</h1>
        <div class="speed-tag">速度: 1/4 スローモード (3種の星コレクション)</div>
        <div class="score-box">Score: <span id="score-val">0</span></div>
        <div class="score-box">High Score: <span id="high-val">0</span></div>
        <div class="instructions">
            [←] [→] もしくは [A] [D] で移動<br>
            💛 ゴールド (+10) / 💙 ブルー (+25) / 💖 ピンク (+50) を集めよう！
        </div>
    </div>

    <script>
        // --- ゲーム状態 ---
        let score = 0;
        let highScore = 0;
        
        let playerTubeAngle = 0;
        let playerMainAngle = 0;
        
        const SPEED_MULTIPLIER = 0.25;
        const playerSpeedMultiplier = 0.05 * SPEED_MULTIPLIER; 
        const forwardSpeed = 0.8 * SPEED_MULTIPLIER; 
        
        const keys = { Left: false, Right: false };

        // --- Three.js 基本設定 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.015);

        // FOV 120 (広範囲な視点)
        const camera = new THREE.PerspectiveCamera(120, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- ライティング ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(10, 20, 15);
        scene.add(mainLight);

        const pointLight1 = new THREE.PointLight(0x00f0ff, 2, 50);
        const pointLight2 = new THREE.PointLight(0xff00ff, 2, 50);
        scene.add(pointLight1, pointLight2);

        // --- ステージ（巨大な美しいトーラス） ---
        const torusRadius = 40;  
        const torusTube = 12;    
        const torusGeom = new THREE.TorusGeometry(torusRadius, torusTube, 50, 100);
        
        const torusMat = new THREE.MeshStandardMaterial({
            color: 0x111126,
            roughness: 0.1,
            metalness: 0.9,
            flatShading: true,
            emissive: 0x051122
        });
        const torusMesh = new THREE.Mesh(torusGeom, torusMat);
        scene.add(torusMesh);

        const wireframeGeom = new THREE.TorusGeometry(torusRadius, torusTube + 0.05, 20, 40);
        const wireframeMat = new THREE.MeshBasicMaterial({
            color: 0x00aaff,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const wireframe = new THREE.Mesh(wireframeGeom, wireframeMat);
        scene.add(wireframe);

        // --- プレイヤー（多面体） ---
        const playerGeom = new THREE.IcosahedronGeometry(1.2, 0); 
        const playerMat = new THREE.MeshStandardMaterial({
            color: 0x00f0ff,
            emissive: 0x0055aa,
            roughness: 0.0,
            metalness: 1.0,
            flatShading: true
        });
        const playerMesh = new THREE.Mesh(playerGeom, playerMat);
        scene.add(playerMesh);

        // パーティクル軌跡
        const trailCount = 20;
        const trailGeometry = new THREE.BufferGeometry();
        const trailPositions = new Float32Array(trailCount * 3);
        const trailColors = new Float32Array(trailCount * 3);
        
        for(let i=0; i<trailCount; i++) {
            trailColors[i*3] = 0.0;
            trailColors[i*3+1] = 0.8;
            trailColors[i*3+2] = 1.0;
        }
        
        trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        trailGeometry.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
        
        const trailMat = new THREE.PointsMaterial({
            size: 0.4,
            vertexColors: true,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const trailPoints = new THREE.Points(trailGeometry, trailMat);
        scene.add(trailPoints);
        const trailHistory = [];

        // --- 3種類の星（アイテム）の定義 ---
        // 1. 正八面体 (ゴールド / スコア10)
        const starGeom1 = new THREE.OctahedronGeometry(0.8, 0);
        const starMat1 = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0x554400,
            roughness: 0.1,
            metalness: 0.9,
            flatShading: true
        });

        // 2. icosahedron（正二十面体・小サイズ / ブルー / スコア25）
        const starGeom2 = new THREE.IcosahedronGeometry(0.7, 0);
        const starMat2 = new THREE.MeshStandardMaterial({
            color: 0x00d2ff,
            emissive: 0x003355,
            roughness: 0.1,
            metalness: 0.9,
            flatShading: true
        });

        // 3. 鈴・星型っぽく見せるための Dodecahedron（正十二面体 / ピンク / スコア50）
        const starGeom3 = new THREE.DodecahedronGeometry(0.8, 0);
        const starMat3 = new THREE.MeshStandardMaterial({
            color: 0xff007f,
            emissive: 0x660033,
            roughness: 0.1,
            metalness: 0.9,
            flatShading: true
        });

        const items = [];
        const poolSize = 35;

        for (let i = 0; i < poolSize; i++) {
            // 3種類の中からランダムにジオメトリとマテリアル、スコアを割り当ててプールを作成
            const randType = Math.random();
            let geom, mat, typeVal, pointsVal;

            if (randType < 0.5) {
                geom = starGeom1; mat = starMat1; typeVal = 1; pointsVal = 10;
            } else if (randType < 0.8) {
                geom = starGeom2; mat = starMat2; typeVal = 2; pointsVal = 25;
            } else {
                geom = starGeom3; mat = starMat3; typeVal = 3; pointsVal = 50;
            }

            const itMesh = new THREE.Mesh(geom, mat);
            itMesh.userData = { mainAng: 0, tubeAng: 0, active: false, points: pointsVal, type: typeVal };
            itMesh.visible = false;
            scene.add(itMesh);
            items.push(itMesh);
        }

        function getTorusPositionAndNormal(mainAng, tubeAng) {
            const cosMain = Math.cos(mainAng);
            const sinMain = Math.sin(mainAng);
            const cosTube = Math.cos(tubeAng);
            const sinTube = Math.sin(tubeAng);

            const x = (torusRadius + torusTube * cosTube) * cosMain;
            const y = (torusRadius + torusTube * cosTube) * sinMain;
            const z = torusTube * sinTube;

            const nx = cosTube * cosMain;
            const ny = cosTube * sinMain;
            const nz = sinTube;

            return {
                pos: new THREE.Vector3(x, y, z),
                normal: new THREE.Vector3(nx, ny, nz)
            };
        }

        let lastSpawnMainAngle = 0;
        function spawnObjects() {
            if (playerMainAngle - lastSpawnMainAngle > 0.12) {
                lastSpawnMainAngle = playerMainAngle;
                
                const spawnAngle = playerMainAngle + Math.PI * 0.8; 
                const randomTubeAngle = Math.random() * Math.PI * 2;

                const it = items.find(i => !i.userData.active);
                if (it) {
                    it.userData.active = true;
                    it.userData.mainAng = spawnAngle;
                    it.userData.tubeAng = randomTubeAngle;
                    it.visible = true;
                }
            }
        }

        function updateObjects() {
            items.forEach(it => {
                if (!it.userData.active) return;

                if (playerMainAngle - it.userData.mainAng > 0.5) {
                    it.userData.active = false;
                    it.visible = false;
                    return;
                }

                const data = getTorusPositionAndNormal(it.userData.mainAng, it.userData.tubeAng);
                it.position.copy(data.pos).add(data.normal.clone().multiplyScalar(1.0));
                
                it.rotation.x += 0.03 * SPEED_MULTIPLIER * 4;
                it.rotation.y += 0.04 * SPEED_MULTIPLIER * 4;
            });
        }

        function checkCollisions() {
            const playerPos = playerMesh.position;

            items.forEach(it => {
                if (!it.userData.active) return;
                if (playerPos.distanceTo(it.position) < 1.8) {
                    it.userData.active = false;
                    it.visible = false;
                    
                    score += it.userData.points;
                    document.getElementById('score-val').innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        document.getElementById('high-val').innerText = highScore;
                    }
                    
                    // 取得した星の種類によって自機の発光色が変わる演出
                    let flashColor = 0x00ffff;
                    if (it.userData.type === 2) flashColor = 0x00d2ff;
                    if (it.userData.type === 3) flashColor = 0xff007f;

                    playerMesh.material.emissive.setHex(flashColor);
                    setTimeout(() => {
                        playerMesh.material.emissive.setHex(0x0055aa);
                    }, 200);
                }
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
        });

        window.addEventListener('touchstart', (e) => {
            const touchX = e.touches[0].clientX;
            if (touchX < window.innerWidth / 2) keys.Left = true;
            else keys.Right = true;
        });
        window.addEventListener('touchend', () => {
            keys.Left = false;
            keys.Right = false;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            
            if (keys.Left) playerTubeAngle += playerSpeedMultiplier;
            if (keys.Right) playerTubeAngle -= playerSpeedMultiplier;
            
            playerMainAngle += forwardSpeed * delta;

            const playerData = getTorusPositionAndNormal(playerMainAngle, playerTubeAngle);
            
            const targetPlayerPos = playerData.pos.clone().add(playerData.normal.clone().multiplyScalar(1.2));
            playerMesh.position.copy(targetPlayerPos);

            playerMesh.rotation.x += 0.05 * SPEED_MULTIPLIER * 4;
            playerMesh.rotation.y += 0.03 * SPEED_MULTIPLIER * 4;

            const camData = getTorusPositionAndNormal(playerMainAngle - 0.25, playerTubeAngle);
            const targetCamPos = camData.pos.clone().add(camData.normal.clone().multiplyScalar(6));
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(playerMesh.position);
            
            camera.up.copy(playerData.normal);

            pointLight1.position.copy(playerMesh.position).add(playerData.normal.clone().multiplyScalar(3));
            
            spawnObjects();
            updateObjects();
            checkCollisions();

            trailHistory.push(playerMesh.position.clone());
            if (trailHistory.length > trailCount) trailHistory.shift();

            const posAttr = trailGeometry.attributes.position;
            for (let i = 0; i < trailHistory.length; i++) {
                posAttr.setXYZ(i, trailHistory[i].x, trailHistory[i].y, trailHistory[i].z);
            }
            for (let i = trailHistory.length; i < trailCount; i++) {
                posAttr.setXYZ(i, playerMesh.position.x, playerMesh.position.y, playerMesh.position.z);
            }
            posAttr.needsUpdate = true;

            torusMesh.rotation.z += 0.0005 * SPEED_MULTIPLIER * 4;
            wireframe.rotation.z += 0.0005 * SPEED_MULTIPLIER * 4;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
